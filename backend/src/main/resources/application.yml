# ---------------------------------------------------------------------------
# Configuración común. Sin credenciales: todo llega por variable de entorno.
# Los valores por defecto existen SOLO en el perfil `dev`.
# ---------------------------------------------------------------------------
spring:
  application:
    name: cellier
  profiles:
    default: dev

  jpa:
    hibernate:
      # El esquema lo gobierna Flyway. Hibernate solo valida que coincida.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: true

# spring-dotenv: carga el .env del directorio de trabajo (la raiz del repo) como
# PropertySource. Se ignora si no existe, para que un despliegue que use variables
# de entorno reales, o los tests, arranquen igual sin el archivo.
springdotenv:
  directory: ./
  filename: .env
  ignore-if-missing: true
  ignore-if-malformed: false

cellier:
  auth:
    google:
      # Client id de OAuth de Google. Se exige como `aud` de cada ID token.
      client-id: ${GOOGLE_CLIENT_ID}
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
      # Google emite el claim `iss` en estas dos formas; ambas son legitimas.
      allowed-issuers:
        - https://accounts.google.com
        - accounts.google.com
      jwks-cache-ttl: PT1H
      clock-skew: PT60S
    jwt:
      issuer: ${JWT_ISSUER:https://cellier.app}
      # Clave HMAC de los access token. Minimo 32 bytes.
      secret: ${JWT_SECRET}
      access-token-ttl: PT15M
    refresh-token:
      ttl: P30D

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

---
# ---------------------------------------------------------------------------
# dev: valores por defecto pensados para el docker-compose de este repo.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cellier}
    username: ${DB_USER:cellier}
    password: ${DB_PASSWORD:cellier}

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

cellier:
  auth:
    google:
      # Marcador de posicion: pon aqui tu client id real para que el login con Google funcione.
      client-id: ${GOOGLE_CLIENT_ID:cellier-dev-client-id.apps.googleusercontent.com}
    jwt:
      # Secreto de desarrollo. NO se usa en prod: alli la variable es obligatoria.
      secret: ${JWT_SECRET:cellier-dev-secret-no-usar-en-produccion-0123456789}

logging:
  level:
    com.cellier: ${LOG_LEVEL_CELLIER:DEBUG}
    org.flywaydb: INFO

springdoc:
  swagger-ui:
    enabled: true

---
# ---------------------------------------------------------------------------
# test: para las pruebas E2E de Playwright (frontend/e2e). Apunta por defecto al
# Postgres efímero de docker-compose.e2e.yml, nunca al de `dev`, y activa
# TestSupportController (ver com.cellier.identity.web.TestSupportController):
# sin este perfil activo, esa clase no existe.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5555}/${DB_NAME:cellier_e2e}
    username: ${DB_USER:cellier}
    password: ${DB_PASSWORD:cellier}

cellier:
  auth:
    google:
      # El login real con Google no se usa en E2E: TestSupportController lo reemplaza.
      client-id: ${GOOGLE_CLIENT_ID:cellier-e2e-client-id.apps.googleusercontent.com}
    jwt:
      secret: ${JWT_SECRET:cellier-e2e-secret-no-usar-en-produccion-0123456789}

logging:
  level:
    com.cellier: INFO
    org.flywaydb: INFO

springdoc:
  swagger-ui:
    enabled: false

---
# ---------------------------------------------------------------------------
# prod: sin valores por defecto. Si falta una variable, la app no arranca.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    show-sql: false

server:
  # Railway asigna el puerto por PORT y espera que el contenedor escuche ahi: con el 8080
  # fijo el healthcheck no pasa nunca y el despliegue se queda reintentando. El valor por
  # defecto sigue siendo 8080, asi que arrancar el perfil prod en local no cambia.
  # Solo en este perfil: dev y test siguen leyendo SERVER_PORT del bloque comun.
  port: ${PORT:8080}

logging:
  level:
    com.cellier: ${LOG_LEVEL_CELLIER:INFO}
    root: WARN
    # root: WARN silenciaba a Flyway, que informa en INFO. En el primer despliegue contra
    # una base vacia ese es justo el log que hace falta leer: que aplique de V1 a V6 y
    # cuantos milisegundos tardo. dev y test ya lo tenian; prod no.
    org.flywaydb: INFO

springdoc:
  # Swagger UI y el esquema OpenAPI van ABIERTOS en prod: son requisito de entrega.
  # SecurityConfig ya deja publicas /swagger-ui.html, /swagger-ui/**, /v3/api-docs y
  # /v3/api-docs/**; lo unico que faltaba era que springdoc los registrara.
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
