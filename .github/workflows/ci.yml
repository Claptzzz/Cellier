# Integracion continua de Cellier.
#
# Dos trabajos en paralelo porque no dependen el uno del otro: si el frontend falla,
# quiero saber igualmente si el backend esta bien, y al reves.
#
# Lo que este pipeline NO hace, a proposito: los scripts del arnes visual
# (scripts/shots.mjs y scripts/verify-reachability.mjs). Necesitan un servidor de
# desarrollo levantado y el recorrido de alcanzabilidad solo ya tarda unos veinte
# minutos. Esta anotado como mejora futura en el README.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecucion anterior: en una rama activa
# solo interesa el resultado del ultimo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · mvnw verify
    runs-on: ubuntu-latest
    # Son ~258 tests y buena parte levanta un PostgreSQL con Testcontainers. En local
    # tarda unos dos minutos; el limite esta alto para que un runner lento no de un
    # falso rojo, pero bastante por debajo de los 360 minutos por defecto, que dejarian
    # un trabajo colgado consumiendo la cuota durante horas.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Preparar Java 25
        uses: actions/setup-java@v6
        with:
          # La misma que <java.version> en backend/pom.xml. Si se sube alli, se sube aqui.
          java-version: '25'
          distribution: temurin
          cache: maven

      # Testcontainers levanta PostgreSQL por Docker. ubuntu-latest trae Docker ya
      # corriendo, asi que no hace falta ningun servicio declarado en el workflow: si
      # algun dia se cambia de runner, esto es lo primero que deja de funcionar.
      - name: Verificar
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend · tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          # La misma que <frontend.node.version> en backend/pom.xml, sin la v: asi el
          # build del pipeline y el que hace Maven dentro del Dockerfile usan el mismo
          # Node. Si se suben, se suben las dos.
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build de produccion
        working-directory: frontend
        # scripts/sync-environment.mjs inlina el client id en el bundle de Angular. En el
        # runner no hay .env, asi que lo lee de aqui: el script da prioridad a
        # process.env sobre el archivo y no falla si el archivo no existe.
        #
        # No es un secreto en sentido estricto —viaja al navegador en cada carga— pero va
        # como secret del repositorio para no versionarlo. Si el secret no esta definido,
        # la variable llega vacia: el build NO falla, y el aviso de sync-env queda en el
        # log. Por eso se comprueba a continuacion.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: npm run build

      # El build sale con codigo 0 aunque el client id falte, asi que sin esto el
      # pipeline pasaria en verde con un bundle que no puede iniciar sesion con Google.
      # Un paso que solo sabe decir que si no se distingue de uno roto.
      - name: Comprobar que el client id llego al bundle
        working-directory: frontend
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::error::El secret GOOGLE_CLIENT_ID no esta definido en el repositorio."
            echo "Definelo en Settings › Secrets and variables › Actions › New repository secret."
            exit 1
          fi
          if ! grep -rqF "$GOOGLE_CLIENT_ID" dist/cellier-web/browser/; then
            echo "::error::El client id no aparece en el bundle construido."
            exit 1
          fi
          echo "El client id esta en el bundle."
