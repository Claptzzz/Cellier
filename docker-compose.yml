services:
  postgres:
    image: postgres:16-alpine
    container_name: cellier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cellier}
      POSTGRES_USER: ${DB_USER:-cellier}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cellier}
    ports:
      # 5433 en el host a proposito: 5432 suele estar ocupado por un PostgreSQL
      # instalado en el sistema, y el choque se manifiesta como un error de
      # credenciales confuso en vez de como un conflicto de puertos.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - cellier-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cellier} -d ${DB_NAME:-cellier}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cellier-pgdata:
    name: cellier-pgdata
